name: Deploy to EKS

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::226503510091:role/GitHubActionsRole
          aws-region: ap-northeast-1

      - name: Build and Push
        id: build
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          # 内联登录ECR
          aws ecr get-login-password --region ap-northeast-1 \
            | docker login --username AWS --password-stdin 226503510091.dkr.ecr.ap-northeast-1.amazonaws.com
          # 显式指定Dockerfile，构建上下文为当前目录
          docker build -f Dockerfile -t 226503510091.dkr.ecr.ap-northeast-1.amazonaws.com/github-cicd-demo:$IMAGE_TAG .
          docker push 226503510091.dkr.ecr.ap-northeast-1.amazonaws.com/github-cicd-demo:$IMAGE_TAG
          docker tag 226503510091.dkr.ecr.ap-northeast-1.amazonaws.com/github-cicd-demo:$IMAGE_TAG \
            226503510091.dkr.ecr.ap-northeast-1.amazonaws.com/github-cicd-demo:latest
          docker push 226503510091.dkr.ecr.ap-northeast-1.amazonaws.com/github-cicd-demo:latest
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name github-cicd-demo-cluster --region ap-northeast-1

      - name: Apply base resources (namespace/deployment/service)
        run: kubectl apply -f k8s/github-cicd-demo.yaml

      - name: Deploy
        run: |
          kubectl set image deployment/github-cicd-demo \
            github-cicd-demo=226503510091.dkr.ecr.ap-northeast-1.amazonaws.com/github-cicd-demo:${{ env.IMAGE_TAG }} \
            -n github-cicd-demo
          kubectl rollout status deployment/github-cicd-demo -n github-cicd-demo --timeout=120s